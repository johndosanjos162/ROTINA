name: Manter o app ativo

on:
  schedule:
    # A cada 1 hora, no minuto 17 (evita o pico do minuto 0)
    - cron: '17 * * * *'
  workflow_dispatch:   # permite rodar manualmente pelo painel

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar o app Streamlit
        run: |
          # ⚠️ TROQUE pela URL real do SEU app
          URL="https://rotina-yiwfg2exsxkes8akbsqjqx.streamlit.app/"

          echo "Pingando $URL em $(date -u)"

          # -L segue redirecionamentos
          # --max-time 30 evita travar se não responder
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                   -L --max-time 30 "$URL")

          echo "HTTP status final: $STATUS"

          # Streamlit Cloud responde 200 ou 303 (redirect).
          # Ambos indicam que o app está acordado.
          case "$STATUS" in
            200|301|302|303|307|308)
              echo "✅ App está ativo (status $STATUS)."
              ;;
            000)
              echo "❌ Sem resposta (timeout ou DNS)."
              exit 1
              ;;
            5*)
              echo "❌ Erro no servidor do Streamlit ($STATUS)."
              exit 1
              ;;
            *)
              echo "⚠️ Status inesperado: $STATUS (considerado OK)."
              ;;
          esac
